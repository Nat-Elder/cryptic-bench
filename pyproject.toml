[project]
name = "crypticbench"
version = "0.2.0"
description = "Cryptic crossword solving by LLMs with and without chain of thought, with machine-checked derivations."
requires-python = ">=3.10"
dependencies = [
    "inspect-ai==0.3.258",
    "anthropic>=0.115",
    "openai>=2.45",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crypticbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
