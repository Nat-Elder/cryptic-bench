opus47-think:
  route: openrouter
  model: openrouter/anthropic/claude-opus-4.7
  model_batch: openrouter/anthropic/claude-opus-4.7:batch
  batch: true
  arm: think
  family: opus47
  role: think
  # **The one `think` row that has to ask.** PLAN §2.1 defines `think` as the vendor's own
  # default effort, which on this route is the absence of every reasoning key — and that is
  # what every other `think` entry does. It does not work here: five probe clues under exactly
  # that config returned `reasoning_tokens` 0, no thinking block and 330 output tokens on all
  # five, while Sonnet 5 and Opus 5 reasoned under the identical config (probe report §9.2).
  # On OpenRouter, omitting the key leaves Claude 4.7's thinking OFF. So this entry sends
  # `reasoning: {enabled: true}` and nothing else: thinking on, no effort and no budget, so the
  # model still chooses its own dose. It is a **declared deviation** from "the absence of every
  # key", not from "the vendor's default effort", and the five probe rows taken before it are a
  # template-with-no-thinking measurement — do not use them.
  model_args: {reasoning_enabled: true}
  generate: {max_tokens: 16000}
  training_cutoff: null
  training_cutoff_source: NOT CHECKED — not on the OpenRouter listing; take it from the vendor's own page

