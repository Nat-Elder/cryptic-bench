# ---- GPT-6 Astra --------------------------------------------------------------------------
# The headline model (PLAN §1). Its reasoning **cannot be switched off by parameter** (probe,
# 2026-09-10, probe-gate-report §7.1 and §7.3): on OpenRouter `reasoning: {enabled: false}` is a
# 400 ("Reasoning is mandatory") and `minimal` still reasons; on OpenAI's own API
# `reasoning.effort` accepts only low/medium/high/xhigh/max. **The row exists by prompt** (§7.4,
# built 2026-09-10 evening): `reasoning_effort: low` — the lowest legal value — plus the line the
# `nocot` prompt v2 appends for every system, which returned `reasoning_tokens = 0` on 7 of 7
# calls across both routes with the answers correct.
#
# **So `astra-nocot` is the one `nocot` entry with no `reasoning_enabled: false` and the one
# with a `reasoning_effort`**, and it is the reason `nocot` is "asked not to reason, verified
# per call" rather than "reasoning off by parameter". Its zero is a measurement, not a setting:
# every call carries its own count, a call with `reasoning_tokens > 0` leaves the accuracy
# (analysis/metrics.py) and is reported beside it, and the run manifest's `reasoning_gate`
# carries `n_reasoned`. `tests/test_models_yaml.py` states the exception in its docstrings.
# Also learnt: inspect 0.3.258 handles a `gpt-6-*` name as a pre-5 GPT (chat completions,
# `max_tokens`, effort stripped); the direct route needed `model_args: {responses_api: true}`,
# and the Responses API refuses `max_output_tokens` under 16.
astra-nocot:
  route: openrouter
  model: openrouter/openai/gpt-6-astra
  model_batch: openrouter/openai/gpt-6-astra:batch
  batch: true
  arm: nocot
  family: astra
  role: nocot
  # No `model_args`: `reasoning_enabled: false` is a 400 on this model (§7.1). `low` is the
  # lowest effort OpenRouter and OpenAI both accept for a gpt-6 name; the prompt does the rest.
  generate: {max_tokens: 16, reasoning_effort: low}
  training_cutoff: null
  training_cutoff_source: NOT CHECKED — not on the OpenRouter listing; take it from the vendor's own page

astra-think:
  # **Cut 2026-09-10 evening, un-cut the same night (Nat)**, on an estimate of 3,150 output
  # tokens per clue that the gate measured at 630. The premise was wrong, so the row is back:
  # without it PLAN §5.2's gain-ordering test has no row for the model whose gain the Astra post
  # is a claim about. No `cut` field, so no `--include-cut` needed.
  route: openrouter
  model: openrouter/openai/gpt-6-astra
  model_batch: openrouter/openai/gpt-6-astra:batch
  batch: true
  arm: think
  family: astra
  role: think
  generate: {max_tokens: 16000}
  training_cutoff: null
  training_cutoff_source: NOT CHECKED — not on the OpenRouter listing; take it from the vendor's own page

# ---- Claude Fable 5.1 -----------------------------------------------------------------------
# **`think`-only, and that is the point.** PLAN §3 excludes Fable from the `nocot` arm because
# its thinking cannot be disabled through the API — so it cannot have a no-CoT row at all, and
# §3 says it "could have a `think` row, labelled as such, if wanted". Nat wanted it, 2026-09-11.
#
# Consequences, all deliberate: it has no `nocot` entry, so `cot_gain()` reports "needs both
# arms" for the family rather than a gain, and it is absent from the headline table. What it
# contributes is a validity and M2 row for a frontier model, and one fact the no-CoT study
# should state plainly — that the `nocot` table has a hole in it where a model's thinking could
# not be switched off.
#
# No reasoning key, so the vendor default (PLAN §2.1's definition of `think`) — unlike
# opus47-think, which had to ask. Whether Fable's default is thinking ON is unverified; the
# `reasoning_absent` flag in the manifest is the check.
fable-think:
  route: openrouter
  model: openrouter/anthropic/claude-fable-5.1
  model_batch: openrouter/anthropic/claude-fable-5.1:batch
  batch: true
  arm: think
  family: fable
  role: think
  generate: {max_tokens: 16000}
  training_cutoff: null
  training_cutoff_source: NOT CHECKED — not on the OpenRouter listing; take it from the vendor's own page

# **Probe, 2026-09-11.** PLAN §3 excludes Fable from this arm because `reasoning: {enabled:
# false}` is a 400 — the same fact that was true of Astra, and the same conclusion that was
# withdrawn on 2026-09-10 when the arm was redefined as "asked not to reason, verified per
# call" (probe report §7.4). This entry tests whether the exclusion is stale. `low` is the
# lowest effort the Claude families accept; if the count comes back non-zero, the entry is
# deleted and PLAN §3 stands.
fable-nocot:
  route: openrouter
  model: openrouter/anthropic/claude-fable-5.1
  model_batch: openrouter/anthropic/claude-fable-5.1:batch
  batch: true
  arm: nocot
  family: fable
  role: nocot
  # **`structured: true` is the 5 % rule's prescribed remedy, and this system needed it.**
  # Plain, Fable deliberates in the *content* channel at `reasoning_tokens = 0` — 4 of 20 rows
  # were working cut off mid-thought by the 16-token cap.
  # PLAN §2.1: over 5 %, switch to the structured constraint and say so. Measured on the same
  # 20 clues: extra text 20 % -> 5.0 %, 19 of 20 parsing as JSON, **accuracy identical at
  # 0.400** — the channel changed, not the measurement. nocot-bench independently prescribes a
  # JSON schema for this exact model, which rejects both prefill and forced tool choice.
  # It is tight: mean output 15.2 of the 16, so the envelope now drives the truncations.
  # **`max_tokens: 300`, and this is not a loosening of the arm.** With the schema on, the
  # answer arrives as a JSON field and there is no content channel to deliberate in — so the
  # *schema* is the constraint here, not the ceiling. At 16 the envelope (`{"answer": "`, ~11
  # tokens) left about five for the answer and truncated **94 %** of clues whose gold answer
  # exceeds 8 characters, against 12 % of the rest: a length-dependent penalty that depressed
  # Fable's accuracy to 0.522 against 0.567 on its untruncated rows. That biased the headline
  # *towards* our own hypothesis, Fable being a competitor to Astra. nocot-bench names the trap
  # exactly — "tool forcing needs max_tokens >= 300; at 100, some providers truncate the
  # arguments JSON mid-string" — and we were at 16. The model still generates only ~20 tokens.
  generate: {max_tokens: 300, reasoning_effort: low, structured: true}
  training_cutoff: null
  training_cutoff_source: NOT CHECKED — not on the OpenRouter listing; take it from the vendor's own page
