  model_batch: openrouter/anthropic/claude-haiku-4.5:batch
  batch: true
  arm: nocot
  family: haiku45
  role: nocot
  model_args: {reasoning_enabled: false}
  generate: {max_tokens: 16}
  training_cutoff: null
  training_cutoff_source: NOT CHECKED — not on the OpenRouter listing; take it from the vendor's own page

haiku45-think:
  # Cut 2026-09-10 evening, un-cut 2026-09-11 (Nat). Adding it back widens the no-CoT table to
  # seven systems.
  route: openrouter
  model: openrouter/anthropic/claude-haiku-4.5
  model_batch: openrouter/anthropic/claude-haiku-4.5:batch
  batch: true
  arm: think
  family: haiku45
  role: think
  # The only entry that takes an explicit budget: Haiku 4.5 predates adaptive thinking, so
  # `reasoning_tokens` is what turns thinking on for it. On this route the openrouter provider
  # sends it as `reasoning: {max_tokens: 3000}` (verified in openrouter.py, 2026-09-10), which
  # is why haiku45-think IS expressible through OpenRouter.
  generate: {reasoning_tokens: 3000, max_tokens: 8000}
  training_cutoff: null
  training_cutoff_source: NOT CHECKED — not on the OpenRouter listing; take it from the vendor's own page
  # 150-token block + PLAN §6's middle case of 3k thinking. Anthropic bills thinking inside
  # output_tokens, so the estimate is their sum. Replaced at the gate.

# ---- Sonnet 5: the effort ladder (PLAN §2.1, cot-design-2026-09-09.md §3) ------------------
# Six systems on one model. `sonnet5-high` is also this model's `think` row; `sonnet5-off` is
# "thinking off, derivation still written" and is NOT a no-CoT row — only `sonnet5-nocot` is.
# The rungs are OpenRouter's `reasoning.effort` low / medium / high, one to one.
sonnet5-nocot:
  route: openrouter
  model: openrouter/anthropic/claude-sonnet-5
  model_batch: openrouter/anthropic/claude-sonnet-5:batch
  batch: true
  arm: nocot
  family: sonnet5
  role: nocot
  model_args: {reasoning_enabled: false}
  generate: {max_tokens: 16}
  training_cutoff: null
  training_cutoff_source: NOT CHECKED — not on the OpenRouter listing; take it from the vendor's own page

sonnet5-off:
  route: openrouter
  model: openrouter/anthropic/claude-sonnet-5
  model_batch: openrouter/anthropic/claude-sonnet-5:batch
  batch: true
  arm: think
  family: sonnet5
  role: rung
  rung: "off"
  # Thinking disabled, the seven-field template still asked for. Same switch as the `nocot`
  # arm — `reasoning: {enabled: false}` — and no effort is sent, so "off" is the bottom of the
  # ladder rather than a point on it. Declare it in the post as "off = reasoning disabled".
  model_args: {reasoning_enabled: false}
  generate: {max_tokens: 2000}
  training_cutoff: null
  training_cutoff_source: NOT CHECKED — not on the OpenRouter listing; take it from the vendor's own page

sonnet5-low:
