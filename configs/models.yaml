# One entry per **system** = model × reasoning setting (PLAN §2.1, §3). A system is the unit of
# every table in the analysis, so `haiku45-nocot` and `haiku45-think` are two rows, not one.
#
# **One route: OpenRouter** (Nat's ruling, 2026-09-10; PLAN §8). Every live
# system below is an `openrouter/...` slug and the only key the repo needs is
# OPENROUTER_API_KEY. Direct vendor keys are not needed and no entry here uses one.
#
# Keys per entry:
#   cut                      present only on a system cut from the run. Its value is the
#                            ruling that cut it, and run.py refuses the system quoting that
#                            string unless `--include-cut` is passed (`--dry-run` prints it as
#                            cut and moves on). The entries stay for the record (PLAN §3, §8);
#                            deleting them would lose why the row is absent.
#   route                    openrouter | mock. Which key the run needs.
#   model                    the inspect model id, non-batch. `null` where the id is not known;
#                            the runner refuses the system.
#   model_batch              the OpenRouter ':batch' id. Used unless `--sync` is passed.
#   batch                    true = runs go through `model_batch` unless `--sync` is passed.
#   arm                      nocot | think | think_cot. run.py refuses `--task` != this, so a
#                            `max_tokens: 16` config can never be handed the seven-field prompt.
#   model_args               provider constructor args. On this route that is where reasoning
#                            is turned OFF: `reasoning_enabled: false` (see below). Absent on
#                            `astra-nocot` alone, where it is a 400 — see the Astra block.
#   generate                 GenerateConfig fields, validated at load.
#   family / role / rung     how the analysis groups systems. `family` is the model (sonnet5),
#                            `role` is nocot | think | rung | cot: `think` marks the row this
#                            model contributes to the CoT gain (PLAN §5.2), `rung` the Sonnet 5
#                            ladder (§5.5). `sonnet5-high` is both the top rung and Sonnet 5's
#                            `think` row, which is why the two keys are separate.
#   training_cutoff          for the cutoff split (PLAN §2.6). Null on every system: cutoffs are
#                            not on the OpenRouter listing. The analysis declines that arm.
#
# **A null model id or `training_cutoff` is deliberate.** Fill it from the vendor's own page;
# do not fill it from memory.
#
# ---- The `nocot` arm is "asked not to reason, verified per call" ---------------------------
# Prompt **v2** (`prompts/nocot.v2.txt`, the default for the arm) appends one line to v1 asking
# for no reasoning tokens. It is the same prompt on every system in the arm — inert where
# reasoning is off by parameter, load-bearing on `astra-nocot`, where no parameter can turn
# reasoning off and the count is what the claim rests on (probe report §7.4). Two consequences
# that live outside this file: a `nocot` call with `reasoning_tokens > 0` is excluded from that
# system's accuracy and reported beside it (analysis/metrics.py), and every manifest's
# `reasoning_gate` carries `n_reasoned` alongside the unchanged pass rule (mean exactly 0 and
# the field reported on this route).
#
# **No `temperature` anywhere.** Claude 4.7+ (Opus 4.7, Sonnet 5, Opus 5) are always in
# adaptive thinking and reject it, and GPT-5.5 ignores it with reasoning on. So k > 1 is
# default sampling on every system and the frozen "k = 1 at temperature 0" ruling is void
# (PLAN §8). run.py prints this once per invocation.
#
# Model ids: **openrouter.ai/api/v1/models, checked 2026-09-10**. The -pro, -luna and -terra
# variants of these slugs are deliberately not used.
#
# ---- Reasoning on the OpenRouter route -----------------------------------------------------
# Verified against the installed inspect_ai 0.3.258 source on 2026-09-10, not from memory:
#
#   - `model/_providers/openrouter.py` `completion_params()` **deletes** `reasoning_effort`
#     from the OpenAI params and re-sends it as `extra_body.reasoning.effort`, passing the
#     value through unchanged (only `max` is rewritten to `xhigh`). Its own comment records
#     that OpenRouter accepts minimal/low/medium/high/xhigh — **`none` is not on that list**,
#     so `reasoning_effort: none` would put an unaccepted value on the wire. No entry here
#     uses it; `tests/test_models_yaml.py` pins that.
#   - Reasoning is turned **off** with `model_args: {reasoning_enabled: false}`, which the
#     provider collects in `__init__` and sends as `extra_body.reasoning.enabled = false`
#     ("enabled=false will disable reasoning on hybrid models", openrouter.py).
#   - `reasoning_tokens: N` becomes `extra_body.reasoning.max_tokens = N` — but only when
#     `reasoning_effort` is unset (effort wins and `reasoning_tokens` is then warned away).
#     That is how Haiku 4.5 gets its thinking budget on this route.
#   - **Reasoning ON at the vendor's default** is the absence of all three: no
#     `reasoning_effort`, no `reasoning_tokens`, no `reasoning_enabled`, so the provider builds
#     no `reasoning` block at all and OpenRouter passes the model's own default. That is
#     PLAN §2.1's definition of the `think` arm. Unverified without a live call: that the
#     default is reasoning *on* for each of these slugs. The probe measures it (RUNBOOK §2).
#   - `generate.batch` does **nothing** on this route: `openai_compatible.py` passes
#     `batcher=None`, so inspect never opens a batch job for an OpenRouter model. The ':batch'
#     model id is the only batch mechanism, which is why `batch` is a top-level key here and
#     not a `generate` field.

mock:
  route: mock
  model: mockllm/model
  model_batch: null
  batch: false
  arm: nocot
  family: mock
  role: nocot
  generate: {max_tokens: 16}
  training_cutoff: null
  training_cutoff_source: n/a

mock-think:
  route: mock
  model: mockllm/model
  model_batch: null
  batch: false
  arm: think
  family: mock
  role: think
  generate: {max_tokens: 4000}
  training_cutoff: null
  training_cutoff_source: n/a

mock-think-cot:
  route: mock
  model: mockllm/model
  model_batch: null
  batch: false
  arm: think_cot
  family: mock
  role: cot
  generate: {max_tokens: 4000}
  training_cutoff: null
  training_cutoff_source: n/a

